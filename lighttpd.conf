# Default config. Mount your own over /etc/lighttpd/lighttpd.conf to replace it,
# or drop fragments into /etc/lighttpd/conf.d to extend it.
server.document-root = env.SERVER_ROOT
server.port          = env.PORT
server.name          = env.SERVER_NAME
server.modules       = ( "mod_access", "mod_accesslog" )

# ACCESS_LOG=/dev/null silences it. lighttpd points its own stdout at /dev/null,
# so /dev/stdout would discard with no error. server.errorlog is unset, which is stderr.
accesslog.filename   = env.ACCESS_LOG

include "/etc/lighttpd/mime.conf"

# mod_cgi is built but not loaded, so a stray script would otherwise be served as source.
url.access-deny = ( "~", ".bak", ".inc", ".htaccess", ".htpasswd", ".php", ".env" )

include "/etc/lighttpd/conf.d/*.conf"

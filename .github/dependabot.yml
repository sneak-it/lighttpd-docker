version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels: [dependencies, actions]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

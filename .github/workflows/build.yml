name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "lighttpd version (default: newest upstream)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - id: meta
        name: Resolve version and tags
        run: |
          set -eu
          v='${{ inputs.version }}'
          [ -n "$v" ] || v=$(curl -fsSL https://download.lighttpd.net/lighttpd/releases-1.4.x/ \
            | grep -o 'lighttpd-[0-9.]*\.tar\.xz' | sed 's/lighttpd-//;s/\.tar\.xz//' \
            | sort -uV | tail -1)
          case "$v" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad version: '$v'"; exit 1 ;; esac
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # The dated tag never moves, so a rollback target survives every rebuild.
          echo "tags=$img:latest,$img:${v%%.*},$img:${v%.*},$img:$v,$img:$v-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "### lighttpd $v" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          tags: lighttpd-docker:ci
          build-args: LIGHTTPD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        run: tests/test.sh lighttpd-docker:ci '${{ steps.meta.outputs.version }}'

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache-only rebuild of the image the tests just passed against.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: LIGHTTPD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

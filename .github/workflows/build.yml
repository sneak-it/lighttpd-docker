name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "lighttpd version (default: newest upstream)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - id: meta
        name: Resolve version and tags
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: .github/resolve-version.sh >> "$GITHUB_OUTPUT"

      - name: Test tag rules
        run: tests/tags.sh

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@v4

      - name: Build amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          # A cached apk layer would pin stale Alpine packages into every release.
          no-cache: ${{ github.event_name != 'pull_request' }}
          tags: lighttpd-docker:ci-amd64
          build-args: LIGHTTPD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Test amd64
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: tests/test.sh lighttpd-docker:ci-amd64 "$VERSION"

      - name: Build arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          pull: true
          load: true
          no-cache: ${{ github.event_name != 'pull_request' }}
          tags: lighttpd-docker:ci-arm64
          build-args: LIGHTTPD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      # Without it, docker run prints a platform warning that test.sh would read as the version.
      - name: Test arm64
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: tests/test.sh lighttpd-docker:ci-arm64 "$VERSION"

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache-only rebuild of the image the tests just passed against.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: LIGHTTPD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

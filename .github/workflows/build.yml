name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "lighttpd version (default: newest upstream)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - id: meta
        name: Resolve version and tags
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: .github/resolve-version.sh >> "$GITHUB_OUTPUT"

      - name: Test tag rules
        run: tests/tags.sh

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          # A cached apk layer would pin stale Alpine packages into every release.
          no-cache: ${{ github.event_name != 'pull_request' }}
          tags: lighttpd-docker:ci
          build-args: LIGHTTPD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: tests/test.sh lighttpd-docker:ci "$VERSION"

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache-only rebuild of the image the tests just passed against.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: LIGHTTPD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
